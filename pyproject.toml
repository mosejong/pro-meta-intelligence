[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pro-meta-intelligence"
version = "0.10.0"
description = "Leakage-safe, evidence-first esports strategy evaluation foundations"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "mosejong" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9",
  "ruff>=0.6,<1",
]
hosted-ops = [
  "cryptography>=50.0,<51",
  "zstandard>=0.25,<0.26",
]

[project.scripts]
pro-meta = "pro_meta_intelligence.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pro_meta_intelligence = ["config/*.json", "fixtures/*.json"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
