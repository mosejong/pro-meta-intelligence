name: Refresh official schedule

on:
  schedule:
    - cron: "17 */8 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e "."
      - name: Fetch policy-gated official schedule and detect T1 changes
        shell: bash
        run: |
          set +e
          python -m pro_meta_intelligence fetch-schedule \
            --league lck \
            --league lec \
            --league lpl \
            --league lcs \
            --league msi \
            --league worlds \
            --archive-dir outputs/lolesports/raw \
            --output web/public/feed/schedule.json \
            --changes-output web/public/feed/schedule-changes.json \
            --watch-team T1
          status=$?
          set -e
          if [ "$status" -eq 3 ]; then
            echo "Schedule source interval has not elapsed; keeping the published snapshot."
            exit 0
          fi
          exit "$status"
      - name: Validate public schedule artifacts
        working-directory: web
        run: npm ci && npm run test:pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist-pages
      - name: Publish changed schedule artifacts
        shell: bash
        run: |
          if git diff --quiet -- web/public/feed/schedule.json web/public/feed/schedule-changes.json; then
            echo "Official schedule is already current."
            exit 0
          fi
          git config user.name "Pro Meta Intelligence Schedule Bot"
          git config user.email "schedule-bot@pro-meta-intelligence.local"
          git add -- web/public/feed/schedule.json web/public/feed/schedule-changes.json
          git commit -m "chore(schedule): refresh official T1 fixture watch"
          git push origin HEAD:main

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: refresh
    steps:
      - name: Deploy refreshed schedule to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
