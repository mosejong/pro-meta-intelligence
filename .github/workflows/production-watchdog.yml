name: Production publication watchdog

on:
  schedule:
    - cron: "43 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: production-publication-watchdog
  cancel-in-progress: false

env:
  PUBLIC_FEED_BASE_URL: https://mosejong.github.io/pro-meta-intelligence/feed
  INCIDENT_LABEL: ops:publication-watchdog
  INCIDENT_TITLE: "ops: public publication health incident"

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e .
      - name: Fetch and validate independently served public artifacts
        id: health
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          output_dir="outputs/publication-watchdog"
          mkdir -p "$output_dir"
          for artifact in current.json current-creator.json history-status.json decision-outcomes.json schedule.json; do
            curl --fail --show-error --silent --location \
              --retry 3 --retry-all-errors --connect-timeout 10 --max-time 30 \
              --max-filesize 7000000 \
              "$PUBLIC_FEED_BASE_URL/$artifact" \
              --output "$output_dir/$artifact"
          done

          set +e
          python -m pro_meta_intelligence check-publication-watchdog \
            --feed-dir "$output_dir" \
            --maximum-radar-age-hours 50 \
            --maximum-schedule-age-hours 30 \
            --output "$output_dir/health.json"
          status=$?
          set -e

          if [[ -f "$output_dir/health.json" ]]; then
            echo "### Public publication watchdog" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "- Status: $(jq -r '.status' "$output_dir/health.json")" >> "$GITHUB_STEP_SUMMARY"
            echo "- Failed checks: $(jq -r '.failed_checks | if length == 0 then "none" else join(", ") end' "$output_dir/health.json")" >> "$GITHUB_STEP_SUMMARY"
            echo "- Next action: $(jq -r '.next_action' "$output_dir/health.json")" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
      - name: Retain the bounded watchdog audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publication-watchdog-${{ github.run_id }}
          path: outputs/publication-watchdog/health.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Ensure the incident label exists
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh label create "$INCIDENT_LABEL"
          --repo "$GITHUB_REPOSITORY"
          --description "Public feed availability, pairing, or freshness incident"
          --color D73A4A
          --force
      - name: Open or refresh one production incident
        if: always() && steps.health.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          HEALTH_OUTCOME: ${{ steps.health.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          output_dir="outputs/publication-watchdog"
          body_file="$RUNNER_TEMP/publication-watchdog-incident.md"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [[ -f "$output_dir/health.json" ]]; then
            status=$(jq -r '.status' "$output_dir/health.json")
            failed=$(jq -r '.failed_checks | join(", ")' "$output_dir/health.json")
            next_action=$(jq -r '.next_action' "$output_dir/health.json")
          elif [[ "$HEALTH_OUTCOME" == "failure" ]]; then
            status="ENDPOINT_FETCH_FAILED"
            failed="HTTP_DOWNLOAD"
            next_action="CHECK_GITHUB_PAGES_AND_NETWORK"
          else
            status="WATCHDOG_EXECUTION_FAILED"
            failed="CHECK_STEP_NOT_SUCCESSFUL"
            next_action="INSPECT_WORKFLOW_RUN"
          fi
          printf '%s\n' \
            'The independently hosted production watchdog detected an unhealthy public surface.' \
            '' \
            "- Status: $status" \
            "- Failed checks: $failed" \
            "- Next action: $next_action" \
            "- Workflow run: $run_url" \
            '' \
            'This incident is updated in place and will be closed automatically after recovery.' \
            > "$body_file"
          issue_number=$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --label "$INCIDENT_LABEL" \
            --json number \
            --jq '.[0].number // empty')
          if [[ -n "$issue_number" ]]; then
            gh issue edit "$issue_number" --repo "$GITHUB_REPOSITORY" --body-file "$body_file"
          else
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "$INCIDENT_TITLE" \
              --label "$INCIDENT_LABEL" \
              --body-file "$body_file"
          fi
      - name: Close the production incident after recovery
        if: steps.health.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          issue_number=$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --label "$INCIDENT_LABEL" \
            --json number \
            --jq '.[0].number // empty')
          if [[ -n "$issue_number" ]]; then
            gh issue close "$issue_number" \
              --repo "$GITHUB_REPOSITORY" \
              --comment "Production publication watchdog recovered. All public checks pass."
          fi
      - name: Fail the workflow when the public surface is unhealthy
        if: always() && steps.health.outcome != 'success'
        run: exit 1
